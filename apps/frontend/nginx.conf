server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Uploads de arquivos de produto (STL/3MF até 150 MB)
  client_max_body_size 160m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API: encaminhada ao container do backend (mesma origem para o navegador)
  location /api/ {
    proxy_pass http://backend:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preparado para Socket.IO em fases futuras
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }

  # Arquivos com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: rotas do React Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
